<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; color: var(--foreground); }
  .row { display: flex; gap: 28px; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  canvas { display: block; }
  label { color: var(--muted-foreground); letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><canvas id="c0" width="88" height="88"></canvas><label>listening</label></div>
  <div class="cell"><canvas id="c1" width="88" height="88"></canvas><label>thinking</label></div>
  <div class="cell"><canvas id="c2" width="88" height="88"></canvas><label>speaking</label></div>
</div>
<script>
const COLORS = {
  listening: [0.38, 0.78, 1.00],
  thinking:  [0.72, 0.52, 1.00],
  speaking:  [0.20, 0.95, 0.68],
};
function energy(st, t) {
  if (st === "speaking") return 0.35 + 0.45 * Math.abs(Math.sin(t * 7.3));
  if (st === "thinking") return 0.28 + 0.18 * (0.5 + 0.5 * Math.sin(t * 2.2));
  return 0.22 + 0.10 * (0.5 + 0.5 * Math.sin(t * 1.6));
}
function draw(cv, st, t) {
  const ctx = cv.getContext("2d");
  const w = cv.width, h = cv.height, cx = w/2, cy = h/2;
  ctx.clearRect(0,0,w,h);
  const [r,g,b] = COLORS[st];
  const e = energy(st, t);
  const rad = 18 + 16 * e;
  const grd = ctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad * 1.55);
  grd.addColorStop(0, `rgba(${r*255|0},${g*255|0},${b*255|0},${0.55*e+0.12})`);
  grd.addColorStop(0.55, `rgba(${r*255|0},${g*255|0},${b*255|0},0.18)`);
  grd.addColorStop(1, `rgba(${r*255|0},${g*255|0},${b*255|0},0)`);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, rad * 1.55, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(${r*255|0},${g*255|0},${b*255|0},0.92)`;
  ctx.beginPath(); ctx.arc(cx, cy, 7 + 6 * e, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = `rgba(${r*255|0},${g*255|0},${b*255|0},0.55)`;
  ctx.lineWidth = 1.6;
  const a0 = t * (st === "speaking" ? 3.2 : 1.4);
  ctx.beginPath(); ctx.arc(cx, cy, 22 + 8 * e, a0, a0 + 1.8); ctx.stroke();
}
const states = ["listening","thinking","speaking"];
const cvs = states.map((_,i) => document.getElementById("c"+i));
let t = 0;
function tick() {
  t += 0.042;
  states.forEach((st,i) => draw(cvs[i], st, t));
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
