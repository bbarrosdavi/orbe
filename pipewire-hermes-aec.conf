# Cancelamento de eco só na CAPTURA, para o Hermes Voice.
#
# monitor.mode = true é o ponto todo: nesse modo o módulo NÃO cria saída
# virtual. Tira o sinal de referência do monitor da saída real e expõe apenas
# uma fonte filtrada. O caminho de playback fica intocado — não há hop extra
# nem reamostragem no áudio que você escuta. A primeira tentativa, com saída
# virtual como default sink, engasgou a voz exatamente por isso.
#
# target.object prende a captura no microfone FÍSICO. Sem isso, no momento em
# que hermes_aec_source virar a fonte padrão, o módulo passaria a capturar a
# própria saída filtrada: realimentação.
#
# gain_control desligado de propósito: o AGC do webrtc mexe no nível da
# captura e o daemon decide "isto é fala" por piso fixo de RMS. Os dois
# brigam, e quem perde é a detecção de comando.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name  = aec/libspa-aec-webrtc
      monitor.mode  = true
      aec.args = {
        webrtc.gain_control          = false
        webrtc.noise_suppression     = false
        webrtc.transient_suppression = false
        webrtc.high_pass_filter      = false
        webrtc.voice_detection       = false
      }
      capture.props = {
        node.name     = "hermes_aec_capture"
        node.passive  = true
        target.object = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
      }
      source.props = {
        node.name        = "hermes_aec_source"
        node.description = "HermesMicAEC"
      }
    }
  }
]
